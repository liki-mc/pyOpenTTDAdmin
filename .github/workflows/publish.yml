name: Publish Python distribution 🐍📦

# The workflow is triggered when events that include that includes tagas starting with v*.*.* or test_v*.*.*. are sent to the repository.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'test_v*.*.*'

jobs:
# Builds the pythond distribution (wheel and source tarball)
  build_wheels:
    name: Build wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          - os: windows-intel
            runs-on: windows-latest
          - os: windows-arm
            runs-on: windows-11-arm
          - os: macos-intel
            # macos-15-intel is the last x86_64 runner
            runs-on: macos-15-intel
          - os: macos-arm
            # macos-14+ (including latest) are ARM64 runners
            runs-on: macos-latest
          - os: android-intel
            runs-on: ubuntu-latest
            platform: android
          - os: android-arm
            # GitHub Actions doesn’t currently support the Android emulator on any ARM
            # runner. So we build on a non-ARM runner, which will skip the tests.
            runs-on: ubuntu-latest
            platform: android
            archs: arm64_v8a
          - os: ios
            runs-on: macos-latest
            platform: ios
          - os: pyodide
            runs-on: ubuntu-latest
            platform: pyodide
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.0.0
        env:
          CIBW_PLATFORM: ${{ matrix.platform || 'auto' }}
          CIBW_ARCHS: ${{ matrix.archs || 'auto' }}
        # Can also be configured directly, using `with:`
        # with:
        #   package-dir: .
        #   output-dir: wheelhouse
        #   config-file: "{package}/pyproject.toml"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl


  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

# Publishes the built package to TestPyPI (for testing) if the tag starts with test_v.*
  publish-to-testpypi:
      name: Publish to TestPyPI 🐍📦
      needs: [build_wheels, build_sdist]
      runs-on: ubuntu-latest

      environment:
        name: testpypi # Enter the environment name set in the Publisher
        url: https://test.pypi.org/p/pyOpenTTDAdmin # Project URL

      permissions:
        id-token: write  # Grant Publishing permissions

      if: startsWith(github.ref, 'refs/tags/test_v') # Conditional check for TestPyPI publishing

      steps:
      - name: Download all the dists # Download the build artifacts that were saved earlier
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish distribution 📦 to TestPyPI # Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

# Publishes the built package to PyPI (production) if the tag starts with v.*
  publish-to-pypi:
      name: Publish to PyPI 🐍 📦
      needs: [build_wheels, build_sdist]
      runs-on: ubuntu-latest

      environment:
        name: pypi # Enter the environment name set in the Publisher
        url: https://pypi.org/p/pyOpenTTDAdmin # Project URL

      permissions:
        id-token: write

      if: startsWith(github.ref, 'refs/tags/v') # Conditional check for PyPI publishing

      steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
      name: Create GitHub Release with source code 📦
      needs:
        - publish-to-pypi # Start the job only if the PyPI publishing job has completed
      runs-on: ubuntu-latest

      permissions:
        contents: write # Grant permission to create a GitHub release

      steps:
      - name: Checkout code
        uses: actions/checkout@v6 # Checkout the code

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # A temporary token that is automatically generated each time the workflow is run
        run: >-
          gh release create
          '$\{\{ github.ref_name \}\}'
          --repo '$\{\{ github.repository \}\}'
          --notes "Release for version $\{\{ github.ref_name \}\}"
